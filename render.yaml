services:
  - type: web
    name: frontline-arena
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string here on first deploy
      - key: JWT_SECRET
        generateValue: true  # Render generates a random secret for you
      - key: JWT_EXPIRE_HOURS
        value: "168"
      - key: TICK_RATE
        value: "15"
      - key: STAT_FLUSH_INTERVAL
        value: "60"
